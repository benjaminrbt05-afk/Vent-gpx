<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vent GPX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vent GPX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14191b">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1c2326;--mute:#667073;--line:#d5dbd8;--head:#b3261e;--tail:#1b7f79;--side:#8f9a9c;--temp:#c47a0c;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--card:#1e2528;--ink:#e8ecea;--mute:#98a3a5;--line:#303a3d;--head:#e5645b;--tail:#3dbdb4;--side:#7b8789;--temp:#f0a53d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
 padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 24px) calc(env(safe-area-inset-left,0px) + 14px);max-width:820px;margin-inline:auto}
h1{font-size:1.4rem;margin:.1em 0 .6em;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px;min-width:0}
input,button{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
input[type=file]{padding:8px}
button{background:var(--ink);color:var(--bg);border:0;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
button:focus-visible,input:focus-visible{outline:3px solid var(--tail);outline-offset:2px}
.full{grid-column:1/-1}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.chk input{width:auto}
#msg{margin:10px 0 0;color:var(--mute);font-size:.92rem}#msg.err{color:var(--head)}
.hidden{display:none!important}
#map{height:52vh;min-height:300px;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;z-index:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi b{display:block;font-size:1.3rem}.kpi span{font-size:.8rem;color:var(--mute)}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
h2{font-size:1rem;margin:0 0 8px}
ul.runs{list-style:none;margin:0;padding:0}
ul.runs li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
ul.runs li:last-child{border:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;white-space:nowrap}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
.windbox{background:var(--card);color:var(--ink);padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:.8rem;text-align:center}
.windbox svg{display:block;margin:0 auto 2px}
.kmlab{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:.7rem;padding:0 5px;line-height:16px;white-space:nowrap;text-align:center}
.wl{position:absolute;left:100%;top:50%;transform:translate(2px,-50%);font:700 10px system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
#prof{touch-action:pan-y;cursor:crosshair}
.readout{font-size:.9rem;margin-top:8px;min-height:2.8em}
.leaflet-container{font:inherit}
</style>
</head>
<body>
<h1>Vent GPX</h1>

<div class="card">
  <div class="grid">
    <label class="full">Trace GPX<input type="file" id="gpx"></label>
    <button class="ghost full hidden" id="last"></button>
    <label>Date<input type="date" id="date"></label>
    <label>Heure de départ<input type="time" id="time" step="300"></label>
    <label class="full">Vitesse moyenne (km/h)<input type="number" id="spd" inputmode="decimal" value="25" min="8" max="50" step="0.5"></label>
    <label class="chk full"><input type="checkbox" id="man"> Saisir le vent à la main</label>
    <label class="man hidden">Vent (km/h)<input type="number" id="mws" inputmode="decimal" value="15" min="0"></label>
    <label class="man hidden">Vient de (°)<input type="number" id="mwd" inputmode="decimal" value="270" min="0" max="360"></label>
    <button id="go" class="full">Analyser</button>
  </div>
  <p id="msg">Choisis une trace GPX pour commencer.</p>
</div>

<div id="out" class="hidden">
  <button class="ghost" id="share" style="margin-bottom:12px">Partager cette analyse</button>
  <div id="map"></div>
  <div class="card"><div class="kpis" id="kpis"></div></div>
  <div class="card">
    <svg class="chart" id="prof" viewBox="0 0 720 260" role="img" aria-label="Profil altimétrique et vent le long du parcours"></svg>
    <div class="legend"><span><i style="background:var(--head)"></i>Vent de face</span><span><i style="background:var(--tail)"></i>Vent de dos</span><span><i style="background:var(--side)"></i>De côté ou faible</span><span><i style="background:var(--temp)"></i>Température</span></div>
    <div class="readout" id="readout"></div>
  </div>
  <div class="card"><h2>Passages de vent de face</h2><ul class="runs" id="runs"></ul></div>
  <div class="card tw"><table id="tbl"></table></div>
</div>

<script src="leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const DIRS=["N","NE","E","SE","S","SO","O","NO"];
const compass=d=>DIRS[Math.round(((d%360)+360)%360/45)%8];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colHex=c=>c>=5?css('--head'):c<=-5?css('--tail'):css('--side');
let pts=null, gpxName="";

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Valeurs par défaut : aujourd'hui, prochaine heure pleine, dernière vitesse utilisée
(function(){
  const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);
  const p=n=>String(n).padStart(2,"0");
  $("date").value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  $("time").value=`${p(d.getHours())}:00`;
  const s=store.get("spd"); if(s) $("spd").value=s;
  const last=store.get("lastgpx"), nm=store.get("lastname");
  if(last){const b=$("last");b.textContent="Réutiliser la dernière trace : "+(nm||"GPX");b.classList.remove("hidden");
    b.onclick=()=>{try{pts=parseGPX(last);gpxName=nm||"";say(`${gpxName} : ${pts.length} points. Règle la date et l'heure, puis Analyser.`);}catch(e){say(e.message,true);}};}
})();

$("man").onchange=e=>document.querySelectorAll(".man").forEach(x=>x.classList.toggle("hidden",!e.target.checked));
$("gpx").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const txt=await f.text(); pts=parseGPX(txt); gpxName=f.name;
    if(txt.length<4e6){store.set("lastgpx",txt);store.set("lastname",f.name);}
    say(`${f.name} : ${pts.length} points. Règle la date et l'heure, puis Analyser.`);
  }catch(err){pts=null;say(err.message,true);}
};
$("go").onclick=run;
function say(t,err){const m=$("msg");m.textContent=t;m.className=err?"err":"";}

function parseGPX(txt){
  const x=new DOMParser().parseFromString(txt,"application/xml");
  if(x.getElementsByTagName("parsererror").length) throw new Error("Ce fichier n'est pas un GPX valide.");
  let n=[...x.getElementsByTagName("trkpt")]; if(!n.length) n=[...x.getElementsByTagName("rtept")];
  const p=n.map(e=>{const el=e.getElementsByTagName("ele")[0];
    return{lat:+e.getAttribute("lat"),lon:+e.getAttribute("lon"),ele:el?+el.textContent:null};})
    .filter(q=>isFinite(q.lat)&&isFinite(q.lon));
  if(p.length<2) throw new Error("Aucun point de trace trouvé dans ce GPX.");
  return p;
}
function hav(a,b){const R=6371000,dl=rad(b.lat-a.lat),dn=rad(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function bearing(a,b){const y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat));
  const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));
  return (deg(Math.atan2(y,x))+360)%360;}

// Tronçons d'environ 1 km
function makeBins(p){
  const BL=1000,bins=[],cd=[0];
  for(let i=1;i<p.length;i++)cd.push(cd[i-1]+hav(p[i-1],p[i]));
  let start=0,d0=0;
  for(let i=1;i<p.length;i++){
    if(cd[i]-d0>=BL||i===p.length-1){
      if(cd[i]-d0<50&&bins.length){const b=bins[bins.length-1];b.d1=cd[i];b.i1=i;continue;}
      bins.push({d0,d1:cd[i],i0:start,i1:i});d0=cd[i];start=i;
    }
  }
  bins.forEach(b=>{
    b.a=p[b.i0];b.b=p[b.i1];
    const el=p.slice(b.i0,b.i1+1).map(q=>q.ele).filter(v=>v!=null);
    b.ele=el.length?el.reduce((s,v)=>s+v,0)/el.length:null;
    b.brg=bearing(b.a,b.b);
  });
  return {bins,total:cd[cd.length-1],cd};
}

const toMs=s=>{const m=s.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);return Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5]);};
const ymd=ms=>new Date(ms).toISOString().slice(0,10);

async function fetchWind(samples,t0,t1){
  const url="https://api.open-meteo.com/v1/forecast?latitude="+samples.map(s=>s.lat.toFixed(4)).join(",")
   +"&longitude="+samples.map(s=>s.lon.toFixed(4)).join(",")
   +"&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,precipitation,precipitation_probability,cloud_cover,sunshine_duration&daily=sunrise,sunset&wind_speed_unit=kmh&timezone=auto"
   +"&start_date="+ymd(t0)+"&end_date="+ymd(t1);
  const r=await fetch(url); const j=await r.json();
  if(!r.ok||j.error) throw new Error(j.reason||"Réponse invalide du service météo.");
  return Array.isArray(j)?j:[j];
}
// Interpolation horaire (vent par composantes, autres valeurs linéaires)
const fx=(v,u,n=0)=>v!=null&&isFinite(v)?v.toFixed(n)+u:"–";
function windAt(h,ti,t){
  let f=(t-ti[0])/3600000; f=Math.max(0,Math.min(ti.length-1,f));
  const k0=Math.floor(f),k1=Math.min(ti.length-1,k0+1),w=f-k0;
  const uv=k=>{const s=h.wind_speed_10m[k],d=rad(h.wind_direction_10m[k]);return[-s*Math.sin(d),-s*Math.cos(d)];};
  const a=uv(k0),b=uv(k1),u=a[0]+(b[0]-a[0])*w,v=a[1]+(b[1]-a[1])*w;
  const L=(r,sc=1)=>r&&r[k0]!=null?(r[k0]+((r[k1]??r[k0])-r[k0])*w)*sc:null;
  return{ws:Math.hypot(u,v),wd:(deg(Math.atan2(-u,-v))+360)%360,wg:L(h.wind_gusts_10m),tp:L(h.temperature_2m),rn:L(h.precipitation),pp:L(h.precipitation_probability),cc:L(h.cloud_cover),su:L(h.sunshine_duration,1/36)};
}

async function run(){
  if(!pts){say("Charge d'abord une trace GPX.",true);return;}
  const d=$("date").value,tm=$("time").value,spd=+$("spd").value;
  if(!d||!tm||!(spd>0)){say("Renseigne la date, l'heure et la vitesse.",true);return;}
  store.set("spd",spd);
  const {bins,total,cd}=makeBins(pts);CD=cd;
  const t0=toMs(d+"T"+tm), t1=t0+total/(spd/3.6)*1000;
  const manual=$("man").checked; let wx=null,ns=0,per=1;
  if(!manual){
    say("Récupération des prévisions de vent…");
    ns=Math.min(24,Math.max(1,Math.ceil(total/10000))); per=Math.ceil(bins.length/ns);
    const samples=[...Array(ns)].map((_,j)=>bins[Math.min(bins.length-1,Math.floor((j+.5)*per))].a);
    try{ wx=await fetchWind(samples,t0,t1); }
    catch(err){
      say(navigator.onLine?"Prévisions indisponibles ("+err.message+"). Elles couvrent environ 16 jours : pour une autre date, coche « Saisir le vent à la main ».":"Pas de connexion : les prévisions ne sont pas disponibles. Tu peux saisir le vent à la main.",true);
      return;
    }
  }
  bins.forEach((b,i)=>{
    const t=t0+((b.d0+b.d1)/2)/(spd/3.6)*1000; let w;
    if(manual) w={ws:+$("mws").value,wd:+$("mwd").value,wg:null};
    else{const h=wx[Math.min(ns-1,Math.floor(i/per))].hourly;w=windAt(h,h.time.map(toMs),t);}
    b.t=t;b.ws=w.ws;b.wd=w.wd;b.wg=w.wg;b.tp=w.tp;b.rn=w.rn;b.pp=w.pp;b.cc=w.cc;b.su=w.su;
    b.comp=w.ws*Math.cos(rad(w.wd-b.brg));
    b.cross=w.ws*Math.sin(rad(w.wd-b.brg));
  });
  const dd=wx&&wx[0].daily, i0=dd?dd.time.indexOf(d):-1;
  SUN=i0>=0?{r:dd.sunrise[i0].slice(11).replace(":","h"),s:dd.sunset[i0].slice(11).replace(":","h")}:null;
  $("out").classList.remove("hidden");
  render(bins,total,t0,t1,spd);
  say((manual?"Vent saisi à la main, identique sur tout le parcours.":"Prévisions Open-Meteo, vent à 10 m, interpolées à l'heure de passage.")+(gpxName?" — "+gpxName:""));
  $("out").scrollIntoView({behavior:"smooth",block:"start"});
}

const hhmm=ms=>new Date(ms).toISOString().slice(11,16).replace(":","h");
let map,layer,windCtl,windDiv,SUN=null,CD=[],BINS=[],TOTAL=0,curMk=null;

function drawMap(bins,total,avgDir,avgWs){
  if(!map){
    map=L.map("map",{zoomSnap:.5});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
    layer=L.layerGroup().addTo(map);
    windCtl=L.control({position:"topright"});
    windCtl.onAdd=()=>{windDiv=L.DomUtil.create("div","windbox");return windDiv;};
    windCtl.addTo(map);
  }
  layer.clearLayers();
  if(curMk&&map.hasLayer(curMk))map.removeLayer(curMk);
  curMk=L.circleMarker([pts[0].lat,pts[0].lon],{radius:9,color:"#fff",weight:3,fillColor:"#e5645b",fillOpacity:1,interactive:false});
  const all=pts.map(q=>[q.lat,q.lon]);
  L.polyline(all,{color:"#fff",weight:10,opacity:.8,lineCap:"round",interactive:false}).addTo(layer);
  bins.forEach(b=>{
    const ll=pts.slice(b.i0,b.i1+1).map(q=>[q.lat,q.lon]),c=b.comp;
    const tag=c>=5?"vent de face":c<=-5?"vent de dos":"vent de côté ou faible";
    L.polyline(ll,{color:colHex(c),weight:6,opacity:.95,lineCap:"round"}).addTo(layer)
      .bindPopup(`<b>km ${(b.d0/1000).toFixed(0)}–${(b.d1/1000).toFixed(0)}</b> · ${hhmm(b.t)}<br>Vent ${b.ws.toFixed(0)} km/h ${compass(b.wd)}${b.wg!=null?" (rafales "+b.wg.toFixed(0)+")":""}<br>${tag} : ${Math.abs(c).toFixed(0)} km/h`+(b.tp!=null?`<br>${fx(b.tp,"°C")} · pluie ${fx(b.rn," mm",1)} (${fx(b.pp," %")}) · soleil ${fx(b.su," %")}`:""));
  });
  // Flèches de vent : orientation = direction vers laquelle le vent souffle, taille = intensité
  const every=Math.max(3,Math.round(bins.length/22));
  bins.forEach((b,i)=>{
    if(i%every!==Math.floor(every/2))return;
    const sz=Math.round(18+Math.min(b.ws,40)*.7),m=pts[Math.floor((b.i0+b.i1)/2)];
    L.marker([m.lat,m.lon],{interactive:false,icon:L.divIcon({className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
      html:`<div style="position:relative;width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" viewBox="-12 -12 24 24" style="transform:rotate(${(b.wd+180)%360}deg);overflow:visible"><path d="M0,-11 L7,8 L0,4 L-7,8Z" fill="#fff" stroke="#1c2326" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="wl">${Math.round(b.ws)}</span></div>`})}).addTo(layer);
  });
  const step=total>120000?20:10;
  for(let k=step;k*1000<total-2000;k+=step){
    const b=bins.find(x=>x.d1>=k*1000)||bins[bins.length-1];
    L.marker([b.b.lat,b.b.lon],{interactive:false,icon:L.divIcon({className:"",html:`<div class="kmlab">${k}</div>`,iconSize:[26,16],iconAnchor:[13,-6]})}).addTo(layer);
  }
  L.circleMarker([pts[0].lat,pts[0].lon],{radius:8,color:"#fff",weight:2,fillColor:"#1c2326",fillOpacity:1}).addTo(layer).bindTooltip("Départ");
  windDiv.innerHTML=`<svg width="34" height="34" viewBox="-17 -17 34 34"><g transform="rotate(${(avgDir+180)%360})"><path d="M0,-14 L7,6 L0,1 L-7,6Z" fill="currentColor"/></g></svg>${compass(avgDir)} ${avgWs.toFixed(0)} km/h`;
  map.invalidateSize(); map.fitBounds(all,{padding:[24,24]});
}

function render(bins,total,t0,t1,spd){
  const km=total/1000; let head=0,tail=0,wsum=0,dplus=0,prev=null;
  bins.forEach(b=>{const L_=b.d1-b.d0;wsum+=b.comp*L_;
    if(b.comp>=5)head+=L_;else if(b.comp<=-5)tail+=L_;
    if(b.ele!=null){if(prev!=null&&b.ele>prev)dplus+=b.ele-prev;prev=b.ele;}});
  const avg=wsum/total,pct=v=>Math.round(v/total*100)+" %";
  const dur=(t1-t0)/3600000,H=Math.floor(dur),M=Math.round((dur-H)*60);
  const nv=k=>bins.map(b=>b[k]).filter(v=>v!=null&&isFinite(v)),tps=nv("tp"),rns=nv("rn"),pps=nv("pp"),sus=nv("su"),ex=[];
  if(tps.length)ex.push([Math.round(Math.min(...tps))+" à "+Math.round(Math.max(...tps))+" °C","température"]);
  if(rns.length)ex.push([Math.max(...rns).toFixed(1)+" mm/h","pluie max ("+Math.round(Math.max(...pps,0))+" % de probabilité max)"]);
  if(sus.length)ex.push([Math.round(sus.reduce((a,v)=>a+v,0)/sus.length)+" %","ensoleillement moyen"]);
  if(SUN)ex.push([SUN.r+" / "+SUN.s,"lever / coucher du soleil"]);
  $("kpis").innerHTML=[
    [km.toFixed(1)+" km","distance"],
    [Math.round(dplus)+" m","dénivelé positif"],
    [H+" h "+String(M).padStart(2,"0"),"arrivée vers "+hhmm(t1)],
    [(avg>0?"+":"")+avg.toFixed(1)+" km/h","vent moyen sur l'axe ("+(avg>0?"de face":"de dos")+")"],
    [pct(head),"du parcours vent de face"],
    [pct(tail),"du parcours vent de dos"],
  ].concat(ex).map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join("");

  const sx=bins.reduce((a,b)=>a+b.ws*Math.sin(rad(b.wd))*(b.d1-b.d0),0),sy=bins.reduce((a,b)=>a+b.ws*Math.cos(rad(b.wd))*(b.d1-b.d0),0);
  const avgDir=(deg(Math.atan2(sx,sy))+360)%360, avgWs=bins.reduce((a,b)=>a+b.ws*(b.d1-b.d0),0)/total;
  drawMap(bins,total,avgDir,avgWs);

  // Profil + bandeau de vent
  const W=720,PL=40,PR=36,PT=10,PB=48,cw=W-PL-PR,ch=260-PT-PB; let s="";
  const els=bins.map(b=>b.ele).filter(v=>v!=null);
  if(els.length){
    const mn=Math.min(...els),mx=Math.max(...els),rg=Math.max(20,mx-mn);
    const X=d=>PL+d/total*cw,Y=e=>PT+ch-(e-mn)/rg*ch;
    let area=`M${X(0)},${PT+ch}`;bins.forEach(b=>{if(b.ele!=null)area+=`L${X((b.d0+b.d1)/2).toFixed(1)},${Y(b.ele).toFixed(1)}`;});
    area+=`L${X(total)},${PT+ch}Z`;
    s+=`<path d="${area}" fill="var(--line)" stroke="var(--mute)" stroke-width="1.2"/>`;
    s+=`<text x="${PL-6}" y="${PT+8}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(mx)}</text><text x="${PL-6}" y="${PT+ch}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(mn)}</text>`;
  }
  const tb=bins.filter(b=>b.tp!=null);
  if(tb.length){
    const tv=tb.map(b=>b.tp),tn=Math.min(...tv),tx=Math.max(...tv),tr=Math.max(2,tx-tn),TY=v=>PT+ch*.95-(v-tn)/tr*ch*.9;
    s+=`<path d="${tb.map((b,i)=>(i?"L":"M")+(PL+(b.d0+b.d1)/2/total*cw).toFixed(1)+","+TY(b.tp).toFixed(1)).join("")}" fill="none" stroke="var(--temp)" stroke-width="2.5" stroke-linejoin="round"/>`;
    s+=`<text x="${W-PR+4}" y="${(TY(tx)+4).toFixed(0)}" font-size="11" fill="var(--temp)">${Math.round(tx)}°</text><text x="${W-PR+4}" y="${(TY(tn)+4).toFixed(0)}" font-size="11" fill="var(--temp)">${Math.round(tn)}°</text>`;
  }
  bins.forEach(b=>{const x=PL+b.d0/total*cw,w=Math.max(1,(b.d1-b.d0)/total*cw+.5);
    s+=`<rect x="${x.toFixed(1)}" y="${PT+ch+8}" width="${w.toFixed(1)}" height="22" fill="${colHex(b.comp)}"/>`;});
  const step=km>120?20:km>50?10:5;
  for(let k=0;k<=km;k+=step)s+=`<text x="${PL+k*1000/total*cw}" y="${PT+ch+46}" text-anchor="middle" font-size="11" fill="var(--mute)">${k}</text>`;
  s+=`<text x="${W-PR}" y="${PT+ch+46}" text-anchor="end" font-size="11" fill="var(--mute)">km</text>`;
  s+=`<line id="curL" x1="0" x2="0" y1="${PT}" y2="${PT+ch+30}" stroke="var(--ink)" stroke-width="1.5" visibility="hidden"/>`;
  $("prof").innerHTML=s;
  BINS=bins;TOTAL=total;
  $("readout").textContent="Fais glisser ton doigt sur le graphique pour suivre le point sur la carte.";

  // Passages de vent de face (>= 2 km), les plus longs d'abord
  const runs=[];let cur=null;
  bins.forEach(b=>{
    if(b.comp>=5){const L_=b.d1-b.d0;
      if(cur&&cur.e===b.d0){cur.e=b.d1;cur.sum+=b.comp*L_;cur.n+=L_;}
      else{cur={s:b.d0,e:b.d1,sum:b.comp*L_,n:L_,t:b.t};runs.push(cur);}}
  });
  const top=runs.filter(r=>r.e-r.s>=2000).sort((a,b)=>(b.e-b.s)-(a.e-a.s)).slice(0,6).sort((a,b)=>a.s-b.s);
  $("runs").innerHTML=top.length?top.map(r=>`<li><span>km ${Math.round(r.s/1000)} à ${Math.round(r.e/1000)} · ${hhmm(r.t)}</span><b style="color:var(--head)">${(r.sum/r.n).toFixed(0)} km/h</b></li>`).join(""):"<li><span>Aucun passage de vent de face notable.</span></li>";

  // Tableau tous les ~10 km
  const every=Math.max(1,Math.round(10000/(total/bins.length)));
  let h="<tr><th>km</th><th>heure</th><th>vent</th><th>rafales</th><th>vient de</th><th>sur l'axe</th><th>temp.</th><th>pluie</th><th>soleil</th></tr>";
  bins.forEach((b,i)=>{if(i%every===0){const c=b.comp;
    h+=`<tr><td>${(b.d0/1000).toFixed(0)}</td><td>${hhmm(b.t)}</td><td>${b.ws.toFixed(0)} km/h</td><td>${b.wg!=null?b.wg.toFixed(0)+" km/h":"–"}</td><td>${compass(b.wd)} (${Math.round(b.wd)}°)</td><td style="color:${colHex(c)};font-weight:600">${c>=0?"face":"dos"} ${Math.abs(c).toFixed(0)}</td><td>${fx(b.tp,"°")}</td><td>${fx(b.rn," mm",1)}</td><td>${fx(b.su," %")}</td></tr>`;}});
  $("tbl").innerHTML=h;
}

function posAt(d){
  let lo=0,hi=CD.length-1;while(lo<hi){const m=(lo+hi)>>1;if(CD[m]<d)lo=m+1;else hi=m;}
  const i=Math.max(1,lo),a=pts[i-1],b=pts[i],f=Math.min(1,Math.max(0,(d-CD[i-1])/((CD[i]-CD[i-1])||1)));
  return[a.lat+(b.lat-a.lat)*f,a.lon+(b.lon-a.lon)*f];
}
function moveCursor(ev){
  if(!BINS.length)return;
  const r=$("prof").getBoundingClientRect(),x0=40,x1=720-36,x=(ev.clientX-r.left)/r.width*720;
  const f=Math.min(1,Math.max(0,(x-x0)/(x1-x0))),d=f*TOTAL,X=x0+f*(x1-x0),L_=$("curL");
  if(L_){L_.setAttribute("x1",X);L_.setAttribute("x2",X);L_.setAttribute("visibility","visible");}
  const b=BINS.find(q=>d<=q.d1)||BINS[BINS.length-1];
  if(map&&curMk){curMk.setLatLng(posAt(d));if(!map.hasLayer(curMk))curMk.addTo(map);}
  $("readout").innerHTML=`<b>km ${(d/1000).toFixed(1)}</b> · ${hhmm(b.t)} · ${fx(b.ele,"",0)} m · ${fx(b.tp,"°C")}<br>vent ${b.ws.toFixed(0)} km/h ${compass(b.wd)} · ${b.comp>=0?"face":"dos"} ${Math.abs(b.comp).toFixed(0)} · pluie ${fx(b.rn," mm",1)}`;
}
$("prof").addEventListener("pointerdown",e=>{try{e.target.setPointerCapture(e.pointerId);}catch(_){}moveCursor(e);});
$("prof").addEventListener("pointermove",moveCursor);
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function pack(p){
  const keep=[p[0]];let last=p[0];
  for(let i=1;i<p.length;i++)if(hav(last,p[i])>=80||i===p.length-1){keep.push(p[i]);last=p[i];}
  let pl=0,pn=0,pe=0;const nums=[];
  keep.forEach(q=>{const la=Math.round(q.lat*1e5),lo=Math.round(q.lon*1e5),e=Math.round(q.ele||0);nums.push(la-pl,lo-pn,e-pe);pl=la;pn=lo;pe=e;});
  const bytes=new TextEncoder().encode(nums.join(","));
  if(window.CompressionStream){const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "z"+b64(new Uint8Array(await new Response(cs).arrayBuffer()));}
  return "r"+b64(bytes);
}
async function unpack(s){
  let bytes=unb64(s.slice(1));
  if(s[0]==="z"){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(ds).arrayBuffer());}
  const n=new TextDecoder().decode(bytes).split(",").map(Number),out=[];let la=0,lo=0,e=0;
  for(let i=0;i+2<n.length;i+=3){la+=n[i];lo+=n[i+1];e+=n[i+2];out.push({lat:la/1e5,lon:lo/1e5,ele:e});}
  return out;
}
$("share").onclick=async()=>{
  try{
    const g=await pack(pts);
    const q=new URLSearchParams({d:$("date").value,t:$("time").value,s:$("spd").value,n:gpxName.replace(/\.gpx$/i,"")});
    const url=location.origin+location.pathname+"#g="+g+"&"+q;
    if(navigator.share) await navigator.share({title:"Vent GPX",text:"Vent sur "+(gpxName||"ma trace"),url});
    else{await navigator.clipboard.writeText(url);say("Lien copié : colle-le dans un message.");}
  }catch(e){if(e.name!=="AbortError")say("Partage impossible : "+e.message,true);}
};
// Ouverture d'un lien partagé : trace, date, heure et vitesse déjà remplies
(async function(){
  const q=new URLSearchParams(location.hash.slice(1)),g=q.get("g"); if(!g)return;
  try{
    pts=await unpack(g); gpxName=(q.get("n")||"Trace partagée")+".gpx";
    if(q.get("d"))$("date").value=q.get("d"); if(q.get("t"))$("time").value=q.get("t"); if(q.get("s"))$("spd").value=q.get("s");
    run();
  }catch(e){say("Lien de partage illisible.",true);}
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
